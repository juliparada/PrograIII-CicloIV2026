<form id="frmConsultarProducto">
    <div class="card text-bg-dark mb-3" style="min-width: 600px;">
        <div class="card-header">
            <div class="d-flex">
                Búsqueda de Productos
                <div class="ms-auto">
                    <button data-form="busqueda_productos" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-light">
                    <thead>
                        <tr>
                            <th colspan="5">
                                <input type="search" placeholder="Buscar por código o descripción"
                                    id="txtBuscarProducto" name="txtBuscarProducto" class="form-control">
                            </th>
                        </tr>
                        <tr>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th colspan="2"></th>
                        </tr>
                    </thead>
                    <tbody id="tblProductos"></tbody>
                </table>
            </div>
        </div>
    </div>
</form>
<script>
    txtBuscarProducto.addEventListener('input', () => {
        obtenerProductos(txtBuscarProducto.value);
    });
    obtenerProductos();
</script>
