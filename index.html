<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Académico - USSS025125</title>
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .draggable-window {
            position: absolute;
            z-index: 100;
        }
        .card {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <!-- Navbar del Sistema (Tema Claro con acento Azul) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-3" id="navBarSistema" style="display: none;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="#">::.. SISTEMA ACADÉMICO (USSS025125) ..::</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mnxAcademica">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mnxAcademica">
                <div class="navbar-nav me-auto">
                    <a class="nav-link active text-white fw-semibold" href="#" data-form="usuarios">Administrar Usuarios</a>
                    <a class="nav-link text-white-50" href="#" data-form="busqueda_usuarios">Buscar Usuarios</a>
                </div>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3 small">Conectado: <b id="usuarioSesion" class="text-warning">admin</b></span>
                    <button class="btn btn-sm btn-outline-light" id="btnCerrarSesion" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenedores de las ventanas y formularios -->
    <div class="container-fluid position-relative">
        <div class="draggable-window" id="login" style="top: 80px; left: 50%; transform: translateX(-50%); z-index: 1050;"></div>
        <div class="draggable-window" id="usuarios" style="top: 30px; left: 60px; display: none;"></div>
        <div class="draggable-window" id="busqueda_usuarios" style="top: 50px; left: 160px; display: none;"></div>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mnx = document.getElementById('mnxAcademica');
            if (mnx) {
                mnx.addEventListener('click', e => {
                    let form = e.target.dataset.form;
                    if (form) {
                        e.preventDefault();
                        cargarForm(form);
                    }
                });
            }

            // REQUERIMIENTO 5: El login es el primero que se muestra
            cargarForm('login');
        });

        function cargarForm(form, callback) {
            if ($(`#${form} > form`).length <= 0) {
                fetch(`/vistas?form=${form}`)
                .then(response => {
                    if (!response.ok) throw new Error("Vista no encontrada");
                    return response.text();
                })
                .then(html => {
                    $(`#${form}`).html(html).show();
                    $(`#${form}`).draggable({ handle: ".card-header" });
                    cerrarVentana();
                    if (callback) callback();
                })
                .catch(error => {
                    console.error('Error al cargar formulario:', error);
                    alertify.error(`Error al cargar el módulo ${form}`);
                });
            } else {
                $(`#${form}`).show();
                if (callback) callback();
            }
        }

        function cerrarVentana() {
            $('.btn-close').off('click').on('click', function(e) {
                e.preventDefault();
                let form = $(this).data('form');
                if (form) {
                    $(`#${form}`).hide();
                }
            });
        }

        function cerrarSesion() {
            alertify.confirm("Cerrar Sesión", "¿Desea cerrar la sesión actual?", () => {
                $('#navBarSistema').hide();
                $('#usuarios').hide();
                $('#busqueda_usuarios').hide();
                $('#txtLoginClave').val('');
                $('#login').show();
                alertify.message("Sesión finalizada");
            }, () => {});
        }
    </script>
</body>
</html>
